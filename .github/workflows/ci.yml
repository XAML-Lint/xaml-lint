name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET SDK + runtimes
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Print SDK version
        run: dotnet --info

      - name: Restore
        run: dotnet restore xaml-lint.slnx

      - name: Build
        run: dotnet build xaml-lint.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution xaml-lint.slnx --configuration Release --no-build --verbosity normal

      - name: DocTool --check
        run: dotnet run --project src/XamlLint.DocTool --configuration Release --no-build -- --check
